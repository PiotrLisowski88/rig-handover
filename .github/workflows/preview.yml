# Plan morning-digest § 3/§ 4. The preview lives only in the Pages artifact, never in a branch (ADR 0003).
name: preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Save /digest/2026-10-28 as one HTML file
        env:
          LANE_MARKER: ${{ secrets.LANE_MARKER }}
        run: |
          pnpm start &
          for i in $(seq 1 30); do curl -sf http://localhost:8787/health && break; sleep 1; done
          mkdir -p _site
          curl -sf http://localhost:8787/digest/2026-10-28 -o _site/index.html
          kill %1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
